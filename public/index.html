<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#05060d">
<meta name="description" content="Roll a ball down an endless track: no ads, works offline">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Roll">
<title>Roll</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root { --ink: #1d2433; --glass: rgba(255, 255, 255, .78); --cta: #ffd23f; --cta-ink: #3a2a00;
    --top: env(safe-area-inset-top, 0px); --bottom: env(safe-area-inset-bottom, 0px); --ball-y: 84vh; --ball-r: 44px; }
  html, body { margin: 0; height: 100%; background: #05060d; overflow: hidden; touch-action: none;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #fff; }
  canvas { display: block; width: 100vw; height: 100dvh; }
  button { font: inherit; color: inherit; border: 0; padding: 0; background: none; cursor: pointer; touch-action: manipulation; }
  svg { width: 1em; height: 1em; fill: currentColor; display: block; }
  [hidden] { display: none !important; }
  .num { font-variant-numeric: tabular-nums; }

  /* in the game: pause, score, stars. The colour follows the sky (body.dark — a dark sky, light text) */
  #hud { position: fixed; top: var(--top); left: 0; right: 0; display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; font-size: 24px; font-weight: 700; pointer-events: none; color: var(--ink);
    transition: color .6s, opacity .25s; }
  body.dark #hud { color: #fff; }
  #hud.dim { opacity: 0; }
  #hud > * { pointer-events: auto; }
  #score { flex: 1; }
  .ib { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-size: 26px;
    background: rgba(255, 255, 255, .28); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  .ib:active { transform: scale(.92); }
  .stars { display: inline-flex; align-items: center; gap: 5px; }
  .stars svg { color: #ffc107; font-size: .95em; filter: drop-shadow(0 1px 1px rgba(0, 0, 0, .25)); }
  #hudStars.pop svg { animation: pop .25s; }
  @keyframes pop { 40% { transform: scale(1.5) rotate(18deg); } }
  #score.pop { animation: score-pop .35s; transform-origin: left center; }
  @keyframes score-pop { 30% { transform: scale(1.3); } }

  /* screens over the frozen game */
  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    padding: calc(var(--top) + 12px) 16px calc(var(--bottom) + 16px); box-sizing: border-box; color: var(--ink);
    animation: fade .25s both; }
  @keyframes fade { from { opacity: 0; } }
  .screen.tint { background: rgba(10, 14, 30, .38); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
  .bar { align-self: stretch; display: flex; justify-content: space-between; align-items: center; min-height: 44px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border-radius: 20px;
    background: var(--glass); font-weight: 700; font-size: 18px; box-shadow: 0 2px 10px rgba(0, 0, 0, .12);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
  .pill svg { font-size: 20px; }
  .ib.solid { background: var(--glass); box-shadow: 0 2px 10px rgba(0, 0, 0, .12); color: var(--ink); }
  .cup { color: #e09b00; }

  #home h1 { margin: 5vh 0 0; font-size: clamp(64px, 22vw, 120px); line-height: 1; font-weight: 800; letter-spacing: -.03em;
    color: #fff; text-shadow: 0 3px 0 rgba(0, 0, 0, .12), 0 10px 30px rgba(20, 60, 120, .35); }
  #home h1 span { display: inline-block; animation: bob 2.4s ease-in-out infinite; }
  #home h1 span:nth-child(2) { animation-delay: .15s; } #home h1 span:nth-child(3) { animation-delay: .3s; }
  #home h1 span:nth-child(4) { animation-delay: .45s; }
  @keyframes bob { 50% { transform: translateY(-7px); } }
  #homeBest { margin-top: 14px; }
  .cta { width: 104px; height: 104px; border-radius: 50%; background: var(--cta); color: var(--cta-ink); font-size: 60px;
    display: grid; place-items: center; box-shadow: 0 6px 0 #d9a900, 0 14px 30px rgba(0, 0, 0, .25);
    transition: transform .08s, box-shadow .08s; }
  .cta:active { transform: translateY(5px); box-shadow: 0 1px 0 #d9a900, 0 6px 14px rgba(0, 0, 0, .25); }
  #home .cta { position: absolute; top: 47%; left: 50%; margin: -52px 0 0 -52px; animation: pulse 1.8s ease-in-out infinite; }
  @keyframes pulse { 50% { scale: 1.06; } }
  /* the ball in the scene is the skin on show: arrows on its sides, the price over it while it is locked */
  #picker { position: absolute; left: 0; right: 0; top: var(--ball-y); height: 0; }
  #picker .ib { position: absolute; top: -22px; }
  #skPrev { left: calc(50% - var(--ball-r) - 64px); }
  #skNext { left: calc(50% + var(--ball-r) + 20px); }
  #lock { position: absolute; left: 50%; bottom: calc(var(--ball-r) + 14px); transform: translateX(-50%); white-space: nowrap; }
  #dots { position: absolute; left: 0; right: 0; top: calc(var(--ball-r) + 14px); display: flex; justify-content: center; gap: 7px; }
  #dots i { width: 9px; height: 9px; border-radius: 50%; background: rgba(255, 255, 255, .5); box-shadow: 0 1px 3px rgba(0, 0, 0, .2); }
  #dots i.on { background: #fff; transform: scale(1.35); }
  #dots i.locked { background: rgba(0, 0, 0, .25); }
  .ver { position: fixed; bottom: calc(6px + var(--bottom)); right: 10px; font-size: 11px; opacity: .45; }

  /* pause, results, settings: a glass card */
  .card { margin: auto; width: min(340px, 100%); box-sizing: border-box; padding: 22px 20px; border-radius: 28px;
    background: var(--glass); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    box-shadow: 0 16px 50px rgba(0, 0, 0, .3); display: flex; flex-direction: column; align-items: center; gap: 14px;
    animation: rise .3s cubic-bezier(.2, 1.3, .4, 1) both; }
  @keyframes rise { from { transform: translateY(24px) scale(.96); opacity: 0; } }
  .big { font-size: 68px; font-weight: 800; line-height: 1; }
  .row { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 18px;
    background: rgba(29, 36, 51, .08); font-weight: 700; font-size: 17px; }
  .chip svg { font-size: 19px; }
  .card .cta { width: 92px; height: 92px; font-size: 54px; margin: 6px 0; }
  .ob { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; font-size: 30px;
    border: 2px solid rgba(29, 36, 51, .28); box-sizing: border-box; }
  .ob:active { transform: scale(.92); }
  .acts { display: flex; align-items: center; gap: 22px; }
  .acts.wait { pointer-events: none; }
  #overCard.best .big { color: #c98a00; animation: best .7s cubic-bezier(.2, 1.6, .4, 1) .9s both; }
  @keyframes best { from { transform: scale(.6); } }
  #newBest { color: #c98a00; font-size: 40px; animation: best .7s cubic-bezier(.2, 1.6, .4, 1) .9s both; }
  #unlock { animation: rise .4s 1.2s both; }
  #unlock i { width: 30px; height: 30px; border-radius: 50%; box-shadow: inset -3px -4px 6px rgba(0, 0, 0, .2), 0 0 0 3px #fff, 0 0 14px #ffd23f; }
  .sl { align-self: stretch; display: flex; align-items: center; gap: 12px; font-size: 26px; }
  .sl input { flex: 1; min-width: 0; height: 36px; margin: 0; accent-color: #2b6fd6; touch-action: pan-x; }
  .sw { width: 52px; height: 30px; border-radius: 15px; background: rgba(29, 36, 51, .25); position: relative; transition: background .15s; }
  .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff;
    box-shadow: 0 1px 3px rgba(0, 0, 0, .3); transition: transform .15s; }
  .sw[aria-checked="true"] { background: #2b6fd6; }
  .sw[aria-checked="true"]::after { transform: translateX(22px); }
  .sl .gap { flex: 1; }

  /* first runs: a hand shows the swipe */
  #hint { position: fixed; left: 50%; top: 62%; font-size: 64px; color: #fff; pointer-events: none;
    filter: drop-shadow(0 3px 6px rgba(0, 0, 0, .35)); animation: swipe 1.6s ease-in-out infinite; }
  #hint.up { animation: swipe-up .5s ease-out infinite; }
  @keyframes swipe-up { 0% { transform: translate(-50%, 40%); } 100% { transform: translate(-50%, -90%); } }
  @keyframes swipe { 0%, 100% { transform: translateX(-120%) rotate(-12deg); } 50% { transform: translateX(20%) rotate(12deg); } }
  @media (prefers-reduced-motion: reduce) { #home h1 span, #home .cta { animation: none; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 17.3 18.2 21l-1.6-7 5.4-4.7-7.2-.6L12 2 9.2 8.7 2 9.3 7.4 14l-1.6 7z"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M6 19h4V5H6zm8-14v14h4V5z"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></symbol>
  <symbol id="i-again" viewBox="0 0 24 24"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4z"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><path d="M19.14 12.94a7.5 7.5 0 0 0 0-1.88l2.03-1.58a.5.5 0 0 0 .12-.61l-1.92-3.32a.5.5 0 0 0-.59-.22l-2.39.96a7 7 0 0 0-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.48.48 0 0 0-.47.41l-.36 2.54a7.4 7.4 0 0 0-1.62.94l-2.39-.96a.48.48 0 0 0-.59.22L2.74 8.87a.47.47 0 0 0 .12.61l2.03 1.58a7.3 7.3 0 0 0 0 1.88l-2.03 1.58a.5.5 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54a7.4 7.4 0 0 0 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.47.47 0 0 0-.12-.61zM12 15.6a3.6 3.6 0 1 1 0-7.2 3.6 3.6 0 0 1 0 7.2z"/></symbol>
  <symbol id="i-vol" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05A4.5 4.5 0 0 0 16.5 12zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54z"/></symbol>
  <symbol id="i-music" viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3z"/></symbol>
  <symbol id="i-vibe" viewBox="0 0 24 24"><path d="M0 15h2V9H0zm3 2h2V7H3zm19-8v6h2V9zm-3 8h2V7h-2zM16.5 3h-9A1.5 1.5 0 0 0 6 4.5v15A1.5 1.5 0 0 0 7.5 21h9a1.5 1.5 0 0 0 1.5-1.5v-15A1.5 1.5 0 0 0 16.5 3zM16 19H8V5h8z"/></symbol>
  <symbol id="i-cup" viewBox="0 0 24 24"><path d="M19 5h-2V3H7v2H5a2 2 0 0 0-2 2v1a5 5 0 0 0 4.39 4.94A5 5 0 0 0 11 15.9V19H7v2h10v-2h-4v-3.1a5 5 0 0 0 3.61-2.96A5 5 0 0 0 21 8V7a2 2 0 0 0-2-2zM5 8V7h2v3.82A3 3 0 0 1 5 8zm14 0a3 3 0 0 1-2 2.82V7h2z"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><path d="M18 8h-1V6A5 5 0 0 0 7 6v2H6a2 2 0 0 0-2 2v10c0 1.1.9 2 2 2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2zm-6 9a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm3.1-9H8.9V6a3.1 3.1 0 0 1 6.2 0z"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="M10 6 8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></symbol>
  <symbol id="i-hand" viewBox="0 0 24 24"><path d="M9 11.24V7.5a2.5 2.5 0 0 1 5 0v3.74a4.5 4.5 0 0 0 2-3.74 4.5 4.5 0 0 0-9 0c0 1.56.8 2.93 2 3.74zm9.84 4.63-4.54-2.26a1.5 1.5 0 0 0-.54-.11H13v-6a1.5 1.5 0 0 0-3 0v10.74l-3.43-.72a1.2 1.2 0 0 0-.22-.02c-.31 0-.59.13-.79.33l-.79.8 4.94 4.94c.27.27.65.44 1.06.44h6.79c.75 0 1.33-.55 1.44-1.28l.75-5.27a1.5 1.5 0 0 0-.84-1.59z"/></symbol>
  <symbol id="i-done" viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></symbol>
</defs></svg>
<canvas id="c"></canvas>

<div id="hud" hidden>
  <button class="ib" id="btnPause" aria-label="Pause"><svg><use href="#i-pause"/></svg></button>
  <span id="score" class="num">0</span>
  <span class="stars num" id="hudStars"><svg><use href="#i-star"/></svg><span id="starN">0</span></span>
</div>
<div id="hint" hidden><svg><use href="#i-hand"/></svg></div>

<main id="home" class="screen" hidden>
  <div class="bar">
    <span class="pill stars num"><svg><use href="#i-star"/></svg><span id="bank">0</span></span>
    <button class="ib solid" id="btnSet" aria-label="Settings"><svg><use href="#i-gear"/></svg></button>
  </div>
  <h1 aria-label="Roll"><span>R</span><span>o</span><span>l</span><span>l</span></h1>
  <span class="pill num" id="homeBest"><svg class="cup"><use href="#i-cup"/></svg><span id="bestN">0</span></span>
  <button class="cta" id="btnPlay" aria-label="Play"><svg><use href="#i-play"/></svg></button>
  <div id="picker">
    <button class="ib solid" id="skPrev" aria-label="Previous ball"><svg><use href="#i-left"/></svg></button>
    <button class="ib solid" id="skNext" aria-label="Next ball"><svg><use href="#i-right"/></svg></button>
    <span class="pill stars num" id="lock"><svg style="color:inherit"><use href="#i-lock"/></svg><span id="lockN"></span><svg><use href="#i-star"/></svg></span>
    <div id="dots"></div>
  </div>
  <div class="ver" id="ver"></div>
</main>

<section id="pause" class="screen tint" hidden>
  <div class="card" role="dialog" aria-modal="true">
    <div class="row"><span class="chip num" id="pauseScore"></span><span class="chip stars num"><svg><use href="#i-star"/></svg><span id="pauseStars"></span></span></div>
    <button class="cta" id="btnResume" aria-label="Resume"><svg><use href="#i-play"/></svg></button>
    <div class="acts">
      <button class="ob" id="btnPauseHome" aria-label="Home"><svg><use href="#i-home"/></svg></button>
      <button class="ob" id="btnPauseAgain" aria-label="Start over"><svg><use href="#i-again"/></svg></button>
      <button class="ob" id="btnPauseSet" aria-label="Settings"><svg><use href="#i-gear"/></svg></button>
    </div>
  </div>
</section>

<section id="over" class="screen tint" hidden>
  <div class="card" id="overCard" role="dialog" aria-modal="true">
    <div id="newBest" hidden><svg><use href="#i-cup"/></svg></div>
    <div class="big num" id="overScore">0</div>
    <div class="row">
      <span class="chip num"><svg class="cup"><use href="#i-cup"/></svg><span id="overBest"></span></span>
      <span class="chip stars num"><svg><use href="#i-star"/></svg><span id="overStars"></span></span>
    </div>
    <div class="row" id="unlock" hidden></div>
    <div class="acts" id="overActs">
      <button class="ob" id="btnOverHome" aria-label="Home"><svg><use href="#i-home"/></svg></button>
      <button class="cta" id="btnAgain" aria-label="Play again"><svg><use href="#i-play"/></svg></button>
      <span style="width:56px"></span>
    </div>
  </div>
</section>

<section id="set" class="screen tint" hidden>
  <div class="card" role="dialog" aria-modal="true">
    <label class="sl"><svg><use href="#i-vol"/></svg><input type="range" id="volRange" min="0" max="100" step="5" aria-label="Volume"></label>
    <label class="sl"><svg><use href="#i-music"/></svg><input type="range" id="musicRange" min="0" max="100" step="5" aria-label="Music"></label>
    <div class="sl" id="hapticRow"><svg><use href="#i-vibe"/></svg><span class="gap"></span><button class="sw" id="hapticSw" role="switch" aria-label="Vibration"></button></div>
    <button class="ob" id="btnSetDone" aria-label="Done"><svg><use href="#i-done"/></svg></button>
  </div>
</section>
<script type="module" src="client.js"></script>
</body>
</html>
